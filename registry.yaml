# ─────────────────────────────────────────────────────────────
# registry.yaml — 이 저장소가 아는 **어휘**
#
#   시스템이 무엇이고 도메인이 무엇인가. 문서에서 계산해 낼 수 없는 것만 담는다 —
#   어느 문서가 무엇을 담는지는 카탈로그가 답하고, 규약은 앱이 든다.
#
#   **저장소는 전부 대등하다.** 각자 자기가 문서를 들고 있는 시스템·도메인만 선언하고,
#   앱이 열려 있는 저장소들의 선언을 합쳐서 본다. 한 도메인에 여러 시스템이 걸릴 때도
#   각 저장소는 자기 시스템만 적는다 — 전체 지도를 소유하는 저장소는 없다.
#   문서가 다른 저장소로 옮겨 가면 그 선언도 같이 간다.
#
#   사람이 쓰는 곳은 여기까지다. 아래 screens: 와 nav: 는 **앱이 쓰는 자리**이고
#   손으로 고쳐도 다음 저장 때 덮인다:
#     nav:     사이드바에서 끌어 놓기(순서) · 폴더 더블클릭(이름)
#     screens: 화면을 올리거나 지울 때 앱이 맞춘다
#
#   규약은 .claude/rules/proposal-block.md 의 「예외 둘」
# ─────────────────────────────────────────────────────────────

# 제품
product:
  label: "{{PRODUCT_LABEL}}"
  summary: "{{PRODUCT_SUMMARY}}"

# 이 저장소가 담는 것 — 앱이 알 수 없는 유일한 사실이라 여기에 적는다.
#   저장소가 둘 이상 열려 있을 때 새 문서를 어디에 둘지 Kiwi 가 이것으로 판단한다.
#   저장소를 만들 때 한 번 쓰고 거의 안 바뀐다. **비워 두지 않는다** — 비면 Kiwi 는
#   이 저장소를 후보에서 빼고, 여기 둘 문서를 다른 저장소에 제안한다.
scope: |
  {{SCOPE}}

  여기 없는 것은 다른 저장소에 있다 — 무엇이 열려 있는지는 카탈로그가 말한다.

# 이 저장소가 문서를 들고 있는 시스템.
#   문서를 쓰기 시작할 때 하나씩 늘린다. 다른 저장소의 시스템은 여기 적지 않는다.
#   예)
#     billing:
#       label: 결제
#       summary: 요금제·청구·환불을 다루는 시스템
#       depends_on: []      # 입력을 받는 다른 시스템이 있으면 그 키
systems: {}

# 도메인 (DDD) — 라벨과 어느 시스템이 쓰는지만. 정의 본문은 용어집이 갖는다.
#   systems: 는 **이 저장소가 아는 시스템만** 적는다. 나머지는 그 저장소가 자기 것을 적고 합쳐진다.
#   예)
#     subscription:
#       label: 구독
#       systems: [billing]
domains: {}

# ── 여기부터 앱이 쓴다 ────────────────────────────────────────

screens: [] # 아직 등록된 화면이 없다

nav:
  # 사이드바 — 폴더 이름과 순서만. 문서 항목은 앱이 맞춘다(손으로 적지 않는다).
  #   존 둘은 라벨을 미리 박아 둔다. 비워 두면 앱이 폴더 이름을 그대로 써서
  #   `product`·`decisions` 같은 소문자 라벨이 붙는다 — 존은 영문 대문자로 쓴다.
  folders:
    - path: product
      label: Product
    - path: decisions
      label: Decisions
  views: []
